<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kỉ Yếu Lớp 8A3</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* PHẦN ĐẦU TRANG */
        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: linear-gradient(
                135deg,
                #111,
                #292929,
                #111
            );
            color: white;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 64px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
            opacity: 0.85;
        }

        .year {
            margin-top: 25px;
            font-size: 18px;
            letter-spacing: 3px;
        }

        /* NỘI DUNG */
        section {
            padding: 80px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .section-description {
            text-align: center;
            color: #666;
            margin-bottom: 50px;
        }

        /* ALBUM */
        .album {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .photo {
            height: 260px;
            background: #111;
            border: 4px solid #111;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .photo::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid #d71920;
            pointer-events: none;
        }

        .photo span {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            letter-spacing: 2px;
        }

        /* FOOTER */
        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        /* ĐIỆN THOẠI */
        @media (max-width: 700px) {

            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                font-size: 18px;
            }

            .album {
                grid-template-columns: 1fr;
            }

            section {
                padding: 60px 5%;
            }
        }
    </style>
</head>

<body>

    <!-- TRANG BÌA -->
<div class="yearbook">
    <img src="kyyeu.png" class="background">

    <!-- Các ô ảnh sẽ đặt ở đây -->
</div>

        <h2 class="section-title">
            📸 ALBUM KỈ YẾU
        </h2>

        <p class="section-description">
            Những khoảnh khắc không thể quên của lớp 8A3
        </p>

        <div class="album">

            <div class="photo">
                <span>ẢNH 01</span>
            </div>

            <div class="photo">
                <span>ẢNH 02</span>
            </div>

            <div class="photo">
                <span>ẢNH 03</span>
            </div>

            <div class="photo">
                <span>ẢNH 04</span>
            </div>

            <div class="photo">
                <span>ẢNH 05</span>
            </div>

            <div class="photo">
                <span>ẢNH 06</span>
            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>
        Kỉ yếu lớp 8A3 ❤️
    </footer>

</body>
</html>
